[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scdash"
dynamic = ["version"]
description = "Leichtgewichtiges Second-Screen-Dashboard für Star Citizen (liest die Game.log, keine GPU-Last)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
]

[project.scripts]
scdash = "scdash.cli:main"

[project.urls]
Homepage = "https://github.com/phantom-35/starcitizen-dash"

[tool.setuptools]
packages = ["scdash"]

[tool.setuptools.dynamic]
version = { attr = "scdash.__version__" }

[tool.setuptools.package-data]
scdash = ["web/*", "web/fonts/*", "data/*"]
